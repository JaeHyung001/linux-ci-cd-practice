
name: Linux CI-CD Practice

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Check HTML file exists
        run: test -f site/index.html

      - name: Check HTML title
        run: grep -q '<title>My First CI/CD</title>' site/index.html

      - name: Test success
        run: echo "All tests passed!"
  
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
